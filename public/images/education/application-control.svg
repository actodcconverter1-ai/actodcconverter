<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Different loads require different control objectives</title><rect width="900" height="460" fill="#fff"/><g font-family="Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#172f50">Different loads require different control objectives</text><rect x="35" y="105" width="260" height="150" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="49" y="137" font-size="19" fill="#172f50">Voltage supply</text><text x="49" y="163" font-size="15" fill="#172f50">Maintains output voltage</text><text x="50" y="200" font-size="17" fill="#172f50">Load draws its current</text><rect x="320" y="105" width="260" height="150" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="334" y="137" font-size="19" fill="#172f50">Battery charger</text><text x="334" y="163" font-size="15" fill="#172f50">Chemistry-specific profile</text><text x="335" y="200" font-size="16" fill="#172f50">Voltage + current + termination</text><rect x="605" y="105" width="260" height="150" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="619" y="137" font-size="19" fill="#172f50">LED driver</text><text x="619" y="163" font-size="15" fill="#172f50">Regulates LED current</text><text x="620" y="200" font-size="17" fill="#172f50">Within compliance voltage</text><text x="35" y="320" font-size="21" fill="#172f50">Same output voltage does not make these devices interchangeable.</text><text x="35" y="365" font-size="18" fill="#172f50">Battery protection, cell monitoring and LED thermal limits remain separate checks.</text><text x="28" y="440" font-size="15" fill="#172f50">Educational model • Not a construction or mains-wiring plan</text></g></svg>