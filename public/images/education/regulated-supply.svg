<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Rectification, filtering and regulation are distinct</title><rect width="900" height="460" fill="#fff"/><g font-family="Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#172f50">Rectification, filtering and regulation are distinct</text><rect x="35" y="100" width="200" height="90" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="49" y="132" font-size="19" fill="#172f50">Rectifier + C</text><text x="49" y="158" font-size="15" fill="#172f50">DC with ripple</text><path d="M235 145L315 145" fill="none" stroke="#172f50" stroke-width="3"/><rect x="315" y="100" width="230" height="90" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="329" y="132" font-size="19" fill="#172f50">Regulator stage</text><text x="329" y="158" font-size="15" fill="#172f50">Headroom + heat limits</text><path d="M545 145L635 145" fill="none" stroke="#172f50" stroke-width="3"/><rect x="635" y="100" width="225" height="90" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="649" y="132" font-size="19" fill="#172f50">DC load</text><text x="649" y="158" font-size="15" fill="#172f50">Specified V and I</text><text x="50" y="250" font-size="22" fill="#172f50">Linear: Ploss = (Vin − Vout) Iout + Vin Iq</text><text x="50" y="293" font-size="20" fill="#172f50">Example: 12 V → 5 V at 0.5 A, Iq = 0: loss = 3.5 W.</text><text x="50" y="335" font-size="19" fill="#172f50">At supplied 90% stage efficiency: loss = 2.5 / 0.9 − 2.5 ≈ 0.278 W.</text><text x="50" y="380" font-size="18" fill="#172f50">This functional diagram does not specify pin wiring or thermal suitability.</text><text x="28" y="440" font-size="15" fill="#172f50">Educational model • Not a construction or mains-wiring plan</text></g></svg>