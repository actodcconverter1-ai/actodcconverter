<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Two common architectures: isolation changes position</title><rect width="900" height="460" fill="#fff"/><g font-family="Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#172f50">Two common architectures: isolation changes position</text><text x="35" y="85" font-size="20" fill="#172f50">Conventional low-voltage linear supply</text><rect x="35" y="110" width="150" height="80" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="49" y="142" font-size="19" fill="#172f50">AC source</text><path d="M185 150L210 150" fill="none" stroke="#172f50" stroke-width="3"/><rect x="210" y="110" width="170" height="80" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="224" y="142" font-size="19" fill="#172f50">Transformer</text><text x="224" y="168" font-size="15" fill="#172f50">Isolation + ratio</text><path d="M380 150L405 150" fill="none" stroke="#172f50" stroke-width="3"/><rect x="405" y="110" width="140" height="80" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="419" y="142" font-size="19" fill="#172f50">Rectifier</text><text x="419" y="168" font-size="15" fill="#172f50">AC → pulses</text><path d="M545 150L570 150" fill="none" stroke="#172f50" stroke-width="3"/><rect x="570" y="110" width="140" height="80" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="584" y="142" font-size="19" fill="#172f50">Filter C</text><text x="584" y="168" font-size="15" fill="#172f50">Pulses → ripple</text><path d="M710 150L735 150" fill="none" stroke="#172f50" stroke-width="3"/><rect x="735" y="110" width="140" height="80" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="749" y="142" font-size="19" fill="#172f50">Regulator</text><text x="749" y="168" font-size="15" fill="#172f50">Controlled DC</text><text x="35" y="250" font-size="20" fill="#172f50">Typical isolated offline switching supply (simplified)</text><rect x="35" y="275" width="175" height="85" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="49" y="307" font-size="19" fill="#172f50">AC front end</text><text x="49" y="333" font-size="15" fill="#172f50">Protection + rectifier</text><path d="M210 318L235 318" fill="none" stroke="#172f50" stroke-width="3"/><rect x="235" y="275" width="190" height="85" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="249" y="307" font-size="19" fill="#172f50">Switching stage</text><text x="249" y="333" font-size="15" fill="#172f50">High-frequency AC</text><path d="M425 318L450 318" fill="none" stroke="#172f50" stroke-width="3"/><rect x="450" y="275" width="195" height="85" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="464" y="307" font-size="19" fill="#172f50">HF transformer</text><text x="464" y="333" font-size="15" fill="#172f50">Isolation as designed</text><path d="M645 318L670 318" fill="none" stroke="#172f50" stroke-width="3"/><rect x="670" y="275" width="205" height="85" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="684" y="307" font-size="19" fill="#172f50">Output stage</text><text x="684" y="333" font-size="15" fill="#172f50">Rectify + filter + control</text><text x="35" y="405" font-size="18" fill="#172f50">A transformer does not itself convert AC to DC; it is not always the first stage.</text><text x="28" y="440" font-size="15" fill="#172f50">Educational model • Not a construction or mains-wiring plan</text></g></svg>