<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Select a supply by the complete load requirement</title><rect width="900" height="460" fill="#fff"/><g font-family="Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#172f50">Select a supply by the complete load requirement</text><rect x="40" y="100" width="250" height="90" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="54" y="132" font-size="19" fill="#172f50">1 · Output needs</text><text x="54" y="158" font-size="15" fill="#172f50">Voltage, current, polarity</text><path d="M290 145L330 145" fill="none" stroke="#172f50" stroke-width="3"/><rect x="330" y="100" width="250" height="90" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="344" y="132" font-size="19" fill="#172f50">2 · Input + location</text><text x="344" y="158" font-size="15" fill="#172f50">AC range, ambient, enclosure</text><path d="M580 145L620 145" fill="none" stroke="#172f50" stroke-width="3"/><rect x="620" y="100" width="240" height="90" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="634" y="132" font-size="19" fill="#172f50">3 · Verify ratings</text><text x="634" y="158" font-size="15" fill="#172f50">Isolation, derating, protection</text><text x="55" y="265" font-size="22" fill="#172f50">Example load: 12 V × 0.8 A = 9.6 W of delivered DC power.</text><text x="55" y="310" font-size="19" fill="#172f50">Startup demand, temperature and transients still need their own allowances.</text><text x="55" y="355" font-size="19" fill="#172f50">A wattage label alone does not establish compatibility or electrical safety.</text><text x="28" y="440" font-size="15" fill="#172f50">Educational model • Not a construction or mains-wiring plan</text></g></svg>