<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img"><title>Capacitor filter: storage across the load</title><rect width="900" height="460" fill="#fff"/><g font-family="Arial,sans-serif"><text x="28" y="38" font-size="25" fill="#172f50">Capacitor filter: storage across the load</text><rect x="40" y="100" width="180" height="110" rx="10" fill="#edf4ff" stroke="#9abbe2"/><text x="54" y="132" font-size="19" fill="#172f50">Rectifier output</text><text x="54" y="158" font-size="15" fill="#172f50">Pulses at fr</text><path d="M220 120L680 120" fill="none" stroke="#172f50" stroke-width="3"/><path d="M220 270L680 270" fill="none" stroke="#172f50" stroke-width="3"/><path d="M220 210L220 270" fill="none" stroke="#172f50" stroke-width="3"/><path d="M390 120L390 180" fill="none" stroke="#172f50" stroke-width="3"/><path d="M367 180L413 180" fill="none" stroke="#172f50" stroke-width="3"/><path d="M367 194L413 194" fill="none" stroke="#172f50" stroke-width="3"/><path d="M390 194L390 270" fill="none" stroke="#172f50" stroke-width="3"/><path d="M680 120L680 140" fill="none" stroke="#172f50" stroke-width="3"/><path d="M680 140l-9 8 18 12-18 12 18 12-18 12 9 8" stroke="#172f50" stroke-width="3" fill="none"/><path d="M680 204L680 270" fill="none" stroke="#172f50" stroke-width="3"/><circle cx="390" cy="120" r="5" fill="#1764c0"/><circle cx="390" cy="270" r="5" fill="#1764c0"/><text x="420" y="189" font-size="22" fill="#172f50">C</text><text x="355" y="167" font-size="22" fill="#172f50">+</text><text x="702" y="212" font-size="20" fill="#172f50">R load</text><text x="270" y="320" font-size="21" fill="#172f50">Capacitor and load are in parallel.</text><text x="270" y="355" font-size="20" fill="#172f50">The load discharges C between charging crests.</text><text x="270" y="390" font-size="19" fill="#172f50">More load current or less capacitance increases ripple.</text><text x="28" y="440" font-size="15" fill="#172f50">Educational model • Not a construction or mains-wiring plan</text></g></svg>