<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" rx="18" fill="#edf3e6"/><style>text{font-family:Arial,sans-serif;fill:#254635}.title{font-size:29px;font-weight:bold}.sub{font-size:16px;fill:#5d7151}.label{font-size:18px}.small{font-size:14px}.trace{fill:none;stroke:#176349;stroke-width:3}.axis{fill:none;stroke:#b2c3a4;stroke-width:1}.dash{stroke:#75865c;stroke-dasharray:7 5;stroke-width:1.5}</style><text x="48" y="62" class="title">A voltage value does not contain a current rating</text><text x="48" y="95" class="sub">Keep the load assumption separate from verified source capability</text><rect x="65" y="165" width="245" height="135" rx="14" fill="#dce8ca"/><rect x="360" y="165" width="245" height="135" rx="14" fill="#dce8ca"/><rect x="655" y="165" width="245" height="135" rx="14" fill="#dce8ca"/><text x="90" y="212" class="label">Input RMS voltage</text><text x="90" y="252" class="sub">Describes potential</text><text x="384" y="212" class="label">Assumed DC load</text><text x="384" y="252" class="sub">Entered separately</text><text x="680" y="212" class="label">Source capability</text><text x="680" y="252" class="sub">Needs rating context</text><text x="95" y="365" class="label">For a specified constant DC operating point: P = V × I</text><text x="95" y="410" class="sub">This equation does not supply missing source or component limits.</text><text x="95" y="455" class="small">An assumed current can change a ripple estimate without proving available capacity.</text><text x="48" y="508" class="small">Educational model illustration · AC to DC Converter</text></svg>