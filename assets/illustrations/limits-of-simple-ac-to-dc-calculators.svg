<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" rx="18" fill="#edf3e6"/><style>text{font-family:Arial,sans-serif;fill:#254635}.title{font-size:29px;font-weight:bold}.sub{font-size:16px;fill:#5d7151}.label{font-size:18px}.small{font-size:14px}.trace{fill:none;stroke:#176349;stroke-width:3}.axis{fill:none;stroke:#b2c3a4;stroke-width:1}.dash{stroke:#75865c;stroke-dasharray:7 5;stroke-width:1.5}</style><text x="48" y="62" class="title">Useful estimates need visible boundaries</text><text x="48" y="95" class="sub">Choose the model · state the inputs · identify omitted effects</text><rect x="305" y="190" width="350" height="125" rx="15" fill="#176349"/><text x="355" y="238" style="fill:#fff;font-size:23px">Defined rectifier model</text><text x="352" y="275" style="fill:#e2edce;font-size:17px">Average · peak · valley · ripple</text><g fill="#dce8ca"><rect x="55" y="150" width="200" height="75" rx="12"/><rect x="55" y="285" width="200" height="75" rx="12"/><rect x="705" y="150" width="200" height="75" rx="12"/><rect x="705" y="285" width="200" height="75" rx="12"/></g><text x="78" y="194" class="label">Source impedance</text><text x="78" y="329" class="label">Diode dynamics</text><text x="729" y="194" class="label">Capacitor effects</text><text x="729" y="329" class="label">Regulator stage</text><text x="130" y="425" class="label">Outer boxes are excluded from this simplified calculator.</text><text x="130" y="462" class="small">A 20% ripple guardrail limits scope; it is not an accuracy guarantee.</text><text x="48" y="508" class="small">Educational model illustration · AC to DC Converter</text></svg>