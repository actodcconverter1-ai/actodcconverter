<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#638156"/></marker></defs><rect width="960" height="540" fill="#edf3e4"/><text x="50" y="55" font-family="Arial,sans-serif" font-size="13" fill="#244c3c">AC TO DC · CONCEPT GUIDE</text><text x="50" y="112" font-family="Arial,sans-serif" font-size="33" fill="#244c3c">Change one assumption at a time</text><text x="50" y="153" font-family="Arial,sans-serif" font-size="17" fill="#5c7152">Controlled sensitivity is different from a complete hardware prediction.</text><rect x="50" y="215" width="250" height="90" rx="12" fill="#fff" stroke="#a6bca0"/><text x="68" y="250" font-family="Arial,sans-serif" font-size="21" fill="#244c3c">RMS input / diode drop</text><text x="68" y="280" font-family="Arial,sans-serif" font-size="16" fill="#5c7152">set the available top</text><path d="M315 260L405 290" fill="none" stroke="#638156" stroke-width="2" marker-end="url(#arrow)"/><rect x="430" y="245" width="450" height="130" rx="12" fill="#fff" stroke="#a6bca0"/><text x="448" y="280" font-family="Arial,sans-serif" font-size="21" fill="#244c3c">Top → average → valley</text><text x="448" y="310" font-family="Arial,sans-serif" font-size="16" fill="#5c7152">read each result with its assumptions</text><rect x="50" y="345" width="250" height="90" rx="12" fill="#fff" stroke="#a6bca0"/><text x="68" y="380" font-family="Arial,sans-serif" font-size="21" fill="#244c3c">I / frequency / C</text><text x="68" y="410" font-family="Arial,sans-serif" font-size="16" fill="#5c7152">set charge-balance ripple</text><path d="M315 390L405 330" fill="none" stroke="#638156" stroke-width="2" marker-end="url(#arrow)"/><text x="435" y="430" font-family="Arial,sans-serif" font-size="19" fill="#244c3c">Real source and component effects can interact.</text><text x="50" y="506" font-family="Arial,sans-serif" font-size="14" fill="#65795a">Conceptual illustration · stated assumptions apply · not a wiring diagram</text></svg>